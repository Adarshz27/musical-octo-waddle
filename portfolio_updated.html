  <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close image">×</button>
  <figure>
    <img id="lightboxImage" src="" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
</div>

<footer class="footer">
  <a class="brand" href="index.html#home">
    <span class="brand-mark">PS</span>
    <span>Palette Studio</span>
  </a>
  <p>Where Every Face Becomes a Masterpiece.</p>
  <div><a href="#top">Back to top ↑</a></div>
</footer>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<script src="script.js"></script>
<script>
(() => {
  const box = document.getElementById('portfolioLightbox');
  const image = document.getElementById('lightboxImage');
  const caption = document.getElementById('lightboxCaption');
  const close = document.getElementById('lightboxClose');
  const cards = document.querySelectorAll('.portfolio-card');

  function openLightbox(card) {
    const source = card.querySelector('img');
    image.src = source.currentSrc || source.src;
    image.alt = source.alt;
    caption.textContent = card.querySelector('.portfolio-caption')?.textContent.replace('↗','').trim() || '';
    box.classList.add('open');
    box.setAttribute('aria-hidden','false');
    document.body.classList.add('lightbox-open');
  }

  function closeLightbox() {
    box.classList.remove('open');
    box.setAttribute('aria-hidden','true');
    document.body.classList.remove('lightbox-open');
    image.src = '';
  }

  cards.forEach(card => card.addEventListener('click', () => openLightbox(card)));
  close.addEventListener('click', closeLightbox);
  box.addEventListener('click', event => {
    if (event.target === box) closeLightbox();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') closeLightbox();
  });
})();
</script>
</body>
</html>
